<div class="register-container">
  <h2>Crear Cuenta de Vendedor</h2>
  
  <form>
    <div class="form-row">
      <div class="form-group">
        <label>Nombre del Dueño</label>
        <input type="text" placeholder="Carlos">
      </div>
      <div class="form-group">
        <label>Apellido del Dueño</label>
        <input type="text" placeholder="Mendoza">
      </div>
    </div>
    
    <div class="form-group">
      <label>Correo Corporativo / Tienda</label>
      <input type="email" placeholder="tienda@correo.com">
    </div>
    
    <div class="form-group">
      <label>Contraseña de Acceso</label>
      <input type="password" placeholder="Mínimo 8 caracteres">
    </div>
    
    <button type="button" class="btn-primary" (click)="onRegister()">Registrar mi Negocio</button>
    
    <div class="links">
      <a routerLink="/auth/login">¿Ya tienes cuenta? Inicia sesión aquí</a>
    </div>
  </form>
</div>
