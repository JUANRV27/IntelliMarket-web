<div class="login-container">
  <h2>Iniciar Sesión</h2>
  
  <form>
    <div class="form-group">
      <label>Correo Electrónico</label>
      <input 
        type="email" 
        placeholder="ejemplo@correo.com" 
        [(ngModel)]="email" 
        name="email"
        required>
    </div>
    
    <div class="form-group">
      <label>Contraseña</label>
      <input 
        type="password" 
        placeholder="••••••••" 
        [(ngModel)]="password" 
        name="password"
        required>
    </div>
    
    @if (errorMessage()) {
      <div class="error-banner" style="color: red; margin-bottom: 15px; font-size: 14px;">
        {{ errorMessage() }}
      </div>
    }
    
    <button type="button" class="btn-primary" (click)="onLogin()">Entrar a mi cuenta</button>
    
    <div class="links-container">
      <p>¿No tienes cuenta? Regístrate como:</p>
      <div class="register-links">
        <a routerLink="/auth/register/customer">Cliente</a>
        <span class="divider">|</span>
        <a routerLink="/auth/register-seller">Vendedor (Negocio)</a>
      </div>
    </div>
  </form>
</div>
