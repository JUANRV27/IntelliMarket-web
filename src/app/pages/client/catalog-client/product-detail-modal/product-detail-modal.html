<!-- Modal backdrop -->
<div class="modal-backdrop" *ngIf="isOpen" (click)="close()"></div>

<!-- Modal content -->
<div class="modal-container" *ngIf="isOpen">
  <div class="modal-content">
    <!-- Header -->
    <div class="modal-header">
      <h2>Detalles del Producto</h2>
      <button class="close-btn" (click)="close()">✕</button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <div class="product-detail-grid">
        <!-- Imagen del producto -->
        <div class="product-image-section">
          <img 
            [src]="product?.imageUrl || 'assets/default-product.png'" 
            [alt]="product?.name"
            class="product-image"
          />
          <span class="category-badge">{{ product?.category }}</span>
        </div>

        <!-- Información del producto -->
        <div class="product-info-section">
          <h3 class="product-name">{{ product?.name }}</h3>
          
          <div class="price-section">
            <p class="price">S/ {{ product?.unitPrice | number:'1.2-2' }}</p>
            <span class="stock-badge" [class.low-stock]="product?.stock <= 5">
              Stock: {{ product?.stock || 0 }} unids.
            </span>
          </div>

          <div class="description">
            <h4>Descripción</h4>
            <p>{{ product?.description || 'Sin descripción disponible' }}</p>
          </div>

          <div class="actions">
            <button 
              class="btn-add-cart"
              [disabled]="product?.stock === 0"
              (click)="agregarAlCarrito()"
            >
              {{ product?.stock === 0 ? 'Agotado' : '🛒 Agregar al carrito' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
