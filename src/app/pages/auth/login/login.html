<div class="login-container">
  <h2>Iniciar Sesión</h2>
  
  <form (ngSubmit)="onLogin()">
    
    <div class="form-group">
      <label>Correo Electrónico</label>
      <input type="email" name="email" [(ngModel)]="email" (ngModelChange)="ocultarError()" placeholder="ejemplo@correo.com" required>
    </div>
    
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" name="password" [(ngModel)]="password" (ngModelChange)="ocultarError()" placeholder="••••••••" required>
    </div>
    
    <button type="submit" class="btn-primary">Entrar a mi cuenta</button>
    
    @if (errorMessage) {
      <p style="color: #e74c3c; margin-top: 10px; text-align: center; font-size: 0.9rem;">
        {{ errorMessage }}
      </p>
    }
    
    <div class="links-container">
      <p>¿No tienes cuenta? Regístrate como:</p>
      <div class="register-links">
        <a routerLink="/auth/register/customer">Cliente</a>
        <span class="divider">|</span>
        <a routerLink="/auth/register/seller">Vendedor (Negocio)</a>
      </div>
    </div>
  </form>
</div>
