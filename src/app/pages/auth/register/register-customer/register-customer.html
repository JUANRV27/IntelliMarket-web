<div class="login-container">
  <h2>Registro de Cliente</h2>
  
  <form (ngSubmit)="onRegister()">
    
    <div class="form-group">
      <label>Nombre</label>
      <input type="text" name="firstName" [(ngModel)]="firstName" placeholder="Tu nombre" required>
    </div>

    <div class="form-group">
      <label>Apellido</label>
      <input type="text" name="lastName" [(ngModel)]="lastName" placeholder="Tu apellido" required>
    </div>

    <div class="form-group">
      <label>Correo Electrónico</label>
      <input type="email" name="email" [(ngModel)]="email" placeholder="ejemplo@correo.com" required>
    </div>
    
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" name="password" [(ngModel)]="password" placeholder="••••••••" required>
    </div>
    
    <button type="submit" class="btn-primary">Crear Cuenta</button>
    
    @if (errorMessage) {
      <p style="color: #e74c3c; margin-top: 10px; text-align: center; font-size: 0.9rem;">
        {{ errorMessage }}
      </p>
    }

    <div class="links-container">
      <p style="text-align: center; margin-top: 15px;">
        <a routerLink="/auth/login" style="color: #3498db; text-decoration: none;">Volver al inicio de sesión</a>
      </p>
    </div>
  </form>
</div>
