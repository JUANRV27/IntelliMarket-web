<div class="login-container">
  <h2>Registro de Vendedor (Negocio)</h2>
  
  <form (ngSubmit)="onRegister()">
    
    <div class="form-group">
      <label>Nombre del Representante</label>
      <input type="text" name="firstName" [(ngModel)]="firstName" placeholder="Tu nombre" required>
    </div>

    <div class="form-group">
      <label>Apellidos del Representante</label>
      <input type="text" name="lastName" [(ngModel)]="lastName" placeholder="Tus apellidos" required>
    </div>

    <div class="form-group">
      <label>Correo Electrónico del Negocio</label>
      <input type="email" name="email" [(ngModel)]="email" placeholder="negocio@correo.com" required>
    </div>
    
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" name="password" [(ngModel)]="password" placeholder="••••••••" required>
    </div>
    
    <button type="submit" class="btn-primary" style="background-color: #27ae60;">
      Crear Cuenta de Negocio
    </button>
    
    @if (errorMessage) {
      <p style="color: #e74c3c; margin-top: 10px; text-align: center; font-size: 0.9rem;">
        {{ errorMessage }}
      </p>
    }

    <div class="links-container">
      <p style="text-align: center; margin-top: 15px;">
        <a routerLink="/auth/login" style="color: #27ae60; text-decoration: none;">Volver al inicio de sesión</a>
      </p>
    </div>
  </form>
</div>
