<header class="main-navbar">
  <div class="nav-left">
    <a [routerLink]="tokenService.isLoggedIn() ? '/catalog' : '/'" class="nav-logo">IntelliMarket</a>
    <a routerLink="/catalog" class="nav-link">Catálogo</a>
  </div>

  <div class="nav-right">
    <a routerLink="/cart" class="cart-btn" title="Carrito de compras">
      <span class="cart-icon">🛒</span>
      @if (cartService.totalItems() > 0) {
        <span class="cart-badge">{{ cartService.totalItems() }}</span>
      }
    </a>

    @if (!tokenService.isLoggedIn()) {
      <a routerLink="/auth/login" class="btn-login">Iniciar Sesión</a>
    } @else {
      <div class="user-menu-container">
        
        @if (menuAbierto()) {
          <div class="menu-overlay" (click)="cerrarMenu()"></div>
        }

        <button class="avatar-circle-btn" (click)="toggleMenu()" title="Mi cuenta">
          <div class="avatar-circle">
            <span class="avatar-icon">👤</span>
          </div>
        </button>

        @if (menuAbierto()) {
          <div class="user-dropdown-menu">
            <a routerLink="/profile" class="dropdown-item" (click)="cerrarMenu()">
              👤 Mi Perfil
            </a>
            <a routerLink="/history" class="dropdown-item" (click)="cerrarMenu()">
              📦 Historial de Compras
            </a>
            <hr class="dropdown-divider">
            <button class="dropdown-item logout-item" (click)="onLogout()">
              🚪 Cerrar Sesión
            </button>
          </div>
        }
      </div>
    }
  </div>
</header>

<main class="layout-content">
  <router-outlet></router-outlet>
</main>
